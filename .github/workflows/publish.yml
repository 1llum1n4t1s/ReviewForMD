name: Publish to Web Stores (CWS + AMO)

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  package:
    name: ZIP パッケージ作成
    runs-on: ubuntu-latest
    outputs:
      artifact-attempt: ${{ steps.artifact-identity.outputs.attempt }}
      # version を後続 job (publish / publish-firefox) の pre-flight check に渡す。
      # 同 version が既に CWS / AMO に存在する場合、publish step を skip して
      # 「同 version 重複 push 拒否」エラーを未然に防ぐ。
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Record native artifact producer attempt
        id: artifact-identity
        shell: bash
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      # サプライチェーン攻撃対策で SHA ピン留め。タグは指すコミットを書き換え可能なため
      # 信頼境界として弱い。バージョン更新時は SHA を取り直してタグコメントも合わせる。
      - name: Checkout release commit with native git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive

      - name: バージョンを取得
        id: version
        run: |
          version=$(grep -oP '(?<="version": ")[^"]+' manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "📦 公開対象バージョン: $version"

      - name: ブランチ名とバージョンの整合性を確認
        env:
          BRANCH_VERSION: ${{ github.ref_name }}
          MANIFEST_VERSION: ${{ steps.version.outputs.version }}
        run: |
          expected="release/${MANIFEST_VERSION}"
          if [ "$BRANCH_VERSION" != "$expected" ]; then
            echo "::error::ブランチ名 ($BRANCH_VERSION) と manifest.json のバージョン ($MANIFEST_VERSION) が一致しません。期待値: $expected"
            exit 1
          fi
          echo "✅ ブランチ名と manifest バージョン一致: $expected"

      - name: Set up Bun
        shell: pwsh
        run: ./scripts/Initialize-BunBuild.ps1 -VersionFile package.json
      - name: Install locked dependencies and verify support assets
        run: bun run deps && bun --bun run sync:support --check

      - name: zip パッケージを作成
        run: |
          # zip.sh を再利用して除外条件（hidden/.env 等）をローカルと一元化する
          # （CI 独自に zip すると zip.sh とズレて将来 src 配下の隠しファイルを誤公開する経路が残る）。
          bash zip.sh
          ls -lh ReviewForMD.zip ReviewForMD-firefox.zip

      - name: ZIP artifact を保存
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          . ./scripts/R2Artifact.Common.ps1
          Publish-R2Artifact -AccountId $env:R2_ARTIFACT_ACCOUNT_ID -Bucket $env:R2_ARTIFACT_BUCKET -AccessKeyId $env:R2_ARTIFACT_ACCESS_KEY_ID -SecretAccessKey $env:R2_ARTIFACT_SECRET_ACCESS_KEY -Name 'reviewformd-zip' -Path @('ReviewForMD.zip','ReviewForMD-firefox.zip') | Out-Null

  publish:
    name: Chrome Web Store にアップロード + Submit for review
    runs-on: ubuntu-latest
    needs: package
    environment: chrome-web-store
    steps:
      - name: Checkout release commit with native git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive

      - name: ZIP artifact を取得
        shell: pwsh
        env:
          ARTIFACT_RUN_ATTEMPT: ${{ needs.package.outputs.artifact-attempt }}
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          & ./scripts/Receive-ReleaseArtifact.ps1 -Name 'reviewformd-zip' -Destination '.' -RunAttempt $env:ARTIFACT_RUN_ATTEMPT

      - name: Chrome Web Store に検証済み ZIP を HTTP 提出
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID || secrets.CWS_PUBLISHER_ID }}
        run: |
          pwsh -NoProfile -File scripts/Test-PublishCws.ps1 -WorkDirectory "$RUNNER_TEMP/cws-publisher-tests"
          pwsh -NoProfile -File scripts/Publish-Cws.ps1 -Archive "ReviewForMD.zip" -CheckExistingVersion -ExistingVersionPolicy Accepted

  publish-firefox:
    name: Firefox AMO に submission
    runs-on: ubuntu-latest
    needs: package
    # Chrome publish とは依存せず、共通 ZIP の作成成功だけを前提にする。
    steps:
      - name: Checkout release commit with native git
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive

      - name: ZIP artifact を取得して Firefox source を展開
        shell: pwsh
        env:
          ARTIFACT_RUN_ATTEMPT: ${{ needs.package.outputs.artifact-attempt }}
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        run: |
          & ./scripts/Receive-ReleaseArtifact.ps1 -Name 'reviewformd-zip' -Destination '.' -RunAttempt $env:ARTIFACT_RUN_ATTEMPT

      - name: Firefox source ディレクトリを構築
        run: |
          # Firefox用ZIPには background.scripts 形式へ変換した manifest.json が入る。
          # Chrome用ZIPをAMOへ渡すとFirefoxでbackgroundが起動しないため、成果物を混同しない。
          rm -rf build-firefox && mkdir -p build-firefox
          unzip -q ReviewForMD-firefox.zip -d build-firefox
          ls -R build-firefox | head -40

      - name: AMO listing メタデータを生成
        run: |
          # webstore/*.txt + package.json と scripts/New-AmoMetadata.ps1 内の公開メタデータを入力として
          # amo-metadata.json（名前/概要/説明/カテゴリ/homepage/support_url/version.license）を生成。
          pwsh -NoProfile -File scripts/New-AmoMetadata.ps1

      - name: AMO へ署名 & 提出（listed）
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          pwsh -NoProfile -File scripts/Test-PublishAmo.ps1 -WorkDirectory "$RUNNER_TEMP/amo-publisher-tests"
          test ! -e build-firefox/.amo-upload-uuid
          mkdir -p web-ext-artifacts
          ARCHIVE="$GITHUB_WORKSPACE/web-ext-artifacts/unsigned-submission.xpi"
          test ! -e "$ARCHIVE"
          pwsh -NoProfile -File scripts/Test-FirefoxArchive.ps1 -WorkDirectory "$RUNNER_TEMP/firefox-archive-tests"
          pwsh -NoProfile -File scripts/New-FirefoxArchive.ps1 -SourceDirectory build-firefox -Archive "$ARCHIVE" > web-ext-artifacts/build-receipt.json
          VERSION=$(python3 -c 'import json; print(json.load(open("build-firefox/manifest.json"))["version"])')
          ADDON_ID=$(python3 -c 'import json; m=json.load(open("build-firefox/manifest.json")); print(m.get("browser_specific_settings",m.get("applications",{}))["gecko"]["id"])')
          SHA256=$(python3 -c 'import json; print(json.load(open("web-ext-artifacts/build-receipt.json"))["sha256"])')
          pwsh -NoProfile -File scripts/Publish-Amo.ps1 -Archive "$ARCHIVE" -Metadata amo-metadata.json -AddonId "$ADDON_ID" -ExpectedVersion "$VERSION" -ExpectedSha256 "$SHA256"
