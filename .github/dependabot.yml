version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # webstore/ は package.json 自体が .gitignore で除外されたローカル専用の
  # 開発補助ツール（スクリーンショット生成）用依存であり、リポジトリには一度も
  # コミットされていない。Dependabot が追跡できる manifest が存在しないため
  # entry を作らない（作ると存在しない path を監視して不可解に失敗する）。
