name: Dependency validation

# main への push と全 PR（Dependabot 以外も）で本体の検証を走らせる。
# release/** の公開 workflow（publish.yml）も ZIP 作成前に同じ検証（構文・AMO metadata・R2 転送）を実行する。
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# 同じ PR の古い実行は取り消す（main push は取り消さず全件検証する）。
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify R2 transfer protocol offline
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/R2Transfer/Run.ps1') -WorkRoot (Join-Path $env:RUNNER_TEMP 'r2-transfer-check')
      - name: Set up Bun
        shell: pwsh
        run: ./scripts/Initialize-BunBuild.ps1 -VersionFile package.json
      - name: Install locked dependencies
        run: bun run deps
      - name: Validate AMO listing metadata
        run: bun test ./scripts/New-AmoMetadata.test.mjs
      - name: Validate 1
        run: bun --bun run sync:support --check
      - name: Validate 2
        run: find src scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -r bun build --no-bundle --outdir "$RUNNER_TEMP/syntax-check"
      - name: Validate 3
        run: bash zip.sh
